name: Cage ClashX macOS arm64

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable upstream release tag (empty selects the latest)'
        type: string
      rebuild:
        description: 'Build again if the version branch already exists'
        type: boolean
        default: false

permissions: {}
concurrency:
  group: cage-clashx-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'uzukizheng/Claude-Cage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    outputs:
      build: ${{ steps.source.outputs.build }}
      tag: ${{ steps.source.outputs.tag }}
      base: ${{ steps.source.outputs.base }}
      branch: ${{ steps.source.outputs.branch }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync main and apply the ClashX patch
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REBUILD: ${{ inputs.rebuild }}
        run: bash scripts/prepare-clashx-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.source.outputs.build == 'true'
        with:
          name: patched-source
          path: ${{ runner.temp }}/clashx.bundle
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: patched-source
          path: ${{ runner.temp }}/patched-source
      - name: Verify the source commit
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch "$RUNNER_TEMP/patched-source/clashx.bundle" "refs/heads/$BRANCH"
          git switch --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = arm64
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build and check the application
        env:
          CAGE_SIGNING_IDENTITY: '-'
          CAGE_BUILD_OUTPUT: ${{ runner.temp }}/Cage ClashX.app
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "${RELEASE_TAG#v}"
          bash scripts/build-app.sh
          go test ./internal/cage ./internal/managedproxy ./internal/workbench -run 'ClashX|LocalProxyConfig' -count=1
          npm run --prefix ui lint
          npm test --prefix ui
          plist="$CAGE_BUILD_OUTPUT/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName Cage ClashX' -c 'Set :CFBundleDisplayName Cage ClashX' "$plist"
          codesign --force --sign - --preserve-metadata=identifier,entitlements "$CAGE_BUILD_OUTPUT"
          codesign --verify --deep --strict "$CAGE_BUILD_OUTPUT"
          test "$(lipo -archs "$CAGE_BUILD_OUTPUT/Contents/MacOS/Cage")" = arm64
          "$CAGE_BUILD_OUTPUT/Contents/Resources/cage" verify-web-assets
      - name: Package the verified build
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          archive="Cage-ClashX-$RELEASE_TAG-macos-arm64.zip"
          ditto -c -k --keepParent --norsrc "$RUNNER_TEMP/Cage ClashX.app" "$archive"
          shasum -a 256 "$archive" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cage-ClashX-${{ needs.prepare.outputs.tag }}-macos-arm64
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: patched-source
          path: ${{ runner.temp }}/patched-source
      - name: Publish the verified commit to its version branch
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          [ "$BRANCH" = "clashx/${BRANCH#clashx/}" ]
          [[ "${BRANCH#clashx/}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch "$RUNNER_TEMP/patched-source/clashx.bundle" "refs/heads/$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git -c push.followTags=false push origin "$SOURCE_SHA:refs/heads/$BRANCH"
          printf 'Published `%s` at `%s`.\n' "$BRANCH" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
